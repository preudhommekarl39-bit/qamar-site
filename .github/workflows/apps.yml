# QAMAR : construit les applications Android et iPhone dans le cloud GitHub (aucun outil à installer sur le PC).
# - Android : APK de test installable directement sur un téléphone Android (artefact « qamar-android-test »).
# - iPhone  : vérifie que le projet Xcode compile (simulateur, sans signature).
# Les versions signées pour les stores sont construites par release-apps.yml (lancement manuel, clés dans les secrets).
# Capacitor 8 : Node 22, Java 21, Xcode 26 (image macos-26 ; macos-14 n'est plus disponible sur GitHub depuis novembre 2026).
name: Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests et garde-fous
        run: node scripts/run-tests.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm run www
      - run: npx cap add android
      - run: npx capacitor-assets generate --assetPath resources --android --iconBackgroundColor '#F7D3DD' --iconBackgroundColorDark '#F7D3DD' --splashBackgroundColor '#FFF7F9' --splashBackgroundColorDark '#FFF7F9'
      - run: node scripts/patch-native.mjs
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - run: npx cap sync android
      - name: Build APK de test
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: qamar-android-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run www
      - run: npx cap add ios
      - run: npx capacitor-assets generate --assetPath resources --ios --splashBackgroundColor '#FFF7F9' --splashBackgroundColorDark '#FFF7F9'
      - run: node scripts/patch-native.mjs
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - run: npx cap sync ios
      - name: Compilation iPhone (simulateur, sans signature)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 40
