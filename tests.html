<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>QAMAR Engine Tests</title>
<style>
  body { font: 15px/1.5 Helvetica, Arial, sans-serif; margin: 0; padding: 30px 20px; background: #FBF4F6; color: #1F1417; }
  h1 { margin: 0 0 6px; } .sum { margin: 0 0 20px; font-weight: 600; }
  li { padding: 6px 0; border-bottom: 1px solid rgba(0,0,0,.06); list-style: none; }
  .ok::before { content: '✓ '; color: #3E8E5A; font-weight: 700; } .ko::before { content: '✗ '; color: #B5523F; font-weight: 700; } .ko { color: #B5523F; }
  ul { padding: 0; max-width: 900px; }
</style>
</head>
<body>
<h1>QAMAR — engine tests</h1>
<p class="sum" id="sum">Running…</p>
<ul id="out"></ul>
<script>window.QAMAR_TEST = true;</script>
<script src="assets/config.js"></script>
<script src="assets/data.js"></script>
<script src="assets/store.js"></script>
<script src="tests/engine-tests.js"></script>
<script>
(function () {
  const out = document.getElementById('out'); let pass = 0, failN = 0;
  const test = (name, fn) => { let ok = false, msg = ''; try { const r = fn(); ok = r === true; if (!ok) msg = ' — got ' + JSON.stringify(r); } catch (e) { msg = ' — ' + e.message; }
    const li = document.createElement('li'); li.className = ok ? 'ok' : 'ko'; li.textContent = name + msg; out.appendChild(li); ok ? pass++ : failN++; };
  window.QAMAR_ENGINE_TESTS(test, Q);
  document.getElementById('sum').textContent = `${pass} passed · ${failN} failed`;
  document.title = (failN ? '✗ ' : '✓ ') + document.title;
})();
</script>
</body>
</html>
